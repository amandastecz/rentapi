name: Trigger Cross Repository Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  cross-repo-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: cross-repo-pipeline-trigger
        uses: amandastecz/pipeline-trigger@v1.1            
        with:
          pat-token: ${{ secrets.PAT_TOKEN }}
          owner: 'amandastecz'
          repo: 'playwright-actions'